<script>
const TIER = ["", "Wd", "St", "Ir", "Gd", "Di", "Am", "Ra", "My"];
const NAME = { stew:"Stew", bench:"Bench", bow:"Bow", arrow:"Arrow", helm:"Helm", spike:"Spike", bed:"Bed", spear:"Spear", axe:"Axe", wall:"Wall", fire:"Fire", coat:"Coat", mask:"Mask", sword:"Sword", bandage:"Wrap" };
const canvas = document.getElementById("c");
let craftOn = false, bookOn = false, last = null;
const api = AshwoodGame.mountGame(canvas, drawHud);
document.getElementById("got").onclick = () => document.getElementById("hint").style.display = "none";
document.getElementById("again").onclick = () => api.start();
document.getElementById("craftBtn").onclick = () => { craftOn = !craftOn; bookOn = false; paintPanels(); };
document.getElementById("bookBtn").onclick = () => { bookOn = !bookOn; craftOn = false; paintPanels(); };
function groupOf(id) {
  if (id.startsWith("helm") || id === "coat" || id === "mask") return "Armor";
  if (id.startsWith("spear") || id.startsWith("axe") || id === "bow" || id === "arrow" || id === "sword") return "Weapons";
  return "Camp";
}
function costText(r) {
  return Object.entries(r.cost).map(([k,n]) => n + " " + k).join(" · ") + (r.bench ? " · workbench" : "");
}
function paintPanels() {
  const hud = last;
  const craft = document.getElementById("craft");
  const book = document.getElementById("book");
  craft.classList.toggle("on", craftOn);
  book.classList.toggle("on", bookOn);
  if (!hud) return;
  const ready = AshwoodGame.RECIPE_LIST.filter((r) => hud.canCraft[r.id]);
  craft.innerHTML = "<b>Ready</b>" + (ready.length ? ready.map((r) => row(r, hud, true)).join("") : "<p class='muted'>Nothing you can make yet.</p>");
  book.innerHTML = "<b>Recipe book</b>" + ["Weapons","Armor","Camp"].map((g) => {
    const list = AshwoodGame.RECIPE_LIST.filter((r) => groupOf(r.id) === g);
    return "<h3>" + g + "</h3>" + list.map((r) => row(r, hud, false)).join("");
  }).join("");
  document.querySelectorAll("[data-id]").forEach((b) => b.onclick = () => api.craft(b.dataset.id));
}
function row(r, hud, onlyReady) {
  const locked = r.tier && r.tier > hud.level;
  const ready = !!hud.canCraft[r.id];
  if (onlyReady && !ready) return "";
  const label = hud.crafting && hud.crafting.name === r.name ? hud.crafting.pct + "%" : locked ? "Lv " + r.tier : ready ? "Make" : "Need";
  return "<div class='recipe'><div><div>" + r.name + "</div><div class='muted'>" + costText(r) + (locked ? " · level " + r.tier : "") + "</div></div><button type='button' data-id='" + r.id + "'" + (ready ? "" : " disabled") + ">" + label + "</button></div>";
}
function drawHud(h) {
  last = h;
  document.getElementById("clock").textContent = h.clock + "  Lv " + h.level + "  " + h.score + " pts";
  document.getElementById("xp").style.width = Math.max(0, Math.min(100, h.xp)) + "%";
  document.getElementById("hp").style.width = h.hp + "%";
  document.getElementById("hunger").style.width = h.hunger + "%";
  document.getElementById("warm").style.width = h.warm + "%";
  const slots = document.getElementById("slots");
  slots.innerHTML = "";
  for (let i = 0; i < AshwoodGame.SLOT_N; i++) {
    const s = h.slots[i];
    const b = document.createElement("button");
    b.type = "button";
    if (h.selected === i) b.className = "on";
    const label = s ? (s.tier ? TIER[s.tier] || "" : (NAME[s.id] || s.id)) : "";
    b.textContent = label || String(i + 1);
    b.onclick = () => api.select(i);
    slots.appendChild(b);
  }
  const toast = document.getElementById("toast");
  toast.style.display = h.toast ? "block" : "none";
  toast.textContent = h.toast || "";
  const dead = document.getElementById("dead");
  const over = h.mode === "dead" || h.mode === "won";
  dead.classList.toggle("on", over);
  if (over) {
    document.getElementById("deadTitle").textContent = h.mode === "won" ? "You won" : "The woods took you";
    document.getElementById("deadBody").textContent = h.mode === "won" ? "The lava dragon is dead. Score " + h.score + "." : "You lasted " + h.score + " points.";
  }
  if (craftOn || bookOn) paintPanels();
  document.getElementById("craftBtn").textContent = "Craft" + (Object.values(h.canCraft).some(Boolean) ? " " + Object.values(h.canCraft).filter(Boolean).length : "");
}
</script>
